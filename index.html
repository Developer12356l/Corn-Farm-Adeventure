<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Corn Farm Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <header>
            <h1>Corn Farm Adventure 🌽</h1>
        </header>
        <main>
            <div id="game">
                <!-- Status Section -->
                <div id="status">
                    <div class="status-item">
                        <img src="images/money_icon.png" alt="Money">
                        <p>$<span id="money">45</span></p>
                    </div>
                    <div class="status-item">
                        <img src="images/seeds_icon.png" alt="Seeds">
                        <p><span id="seeds">0</span>/<span id="storage">9</span></p>
                    </div>
                    <div class="status-item">
                        <img src="images/crops_icon.png" alt="Crops">
                        <p><span id="crops">0</span></p>
                    </div>
                    <div class="status-item">
                        <img src="images/houses_icon.png" alt="Houses">
                        <p><span id="houses">0</span></p>
                    </div>
                    <div class="status-item">
                        <img src="images/tractors_icon.png" alt="Tractors">
                        <p><span id="tractors">0</span></p>
                    </div>
                    <div class="status-item">
                        <img src="images/loan_status_icon.png" alt="Loan">
                        <p>$<span id="loan">0</span></p>
                    </div>
                </div>
                <!-- Message Box -->
                <div id="message-box">
                    <p id="message">Welcome to your corn farm!</p>
                </div>
                <!-- Actions Section -->
                <div id="actions">
                    <input type="number" id="seedAmount" placeholder="Enter seed amount">
                    <button id="buySeed">
                        <img src="images/seed_icon.png" alt="Buy Seed"><br>
                        Buy Seed<br>($10 each)
                    </button>
                    <button id="plantSeed">
                        <img src="images/plant_icon.png" alt="Plant Seed"><br>
                        Plant Seed
                    </button>
                    <button id="plantAllSeeds">
                        <img src="images/plant_icon.png" alt="Plant All Seeds"><br>
                        Plant All Seeds
                    </button>
                    <button id="harvestCrops">
                        <img src="images/harvest_icon.png" alt="Harvest Crops"><br>
                        Harvest
                    </button>
                    <button id="sellCrops">
                        <img src="images/sell_icon.png" alt="Sell Crops"><br>
                        Sell Crops<br>($30 each)
                    </button>
                    <button id="buyStorage">
                        <img src="images/storage_icon.png" alt="Buy Storage"><br>
                        More Storage<br>($100)
                    </button>
                    <button id="buyHouse">
                        <img src="images/house_icon.png" alt="Buy House"><br>
                        Buy House<br>($1000)
                    </button>
                    <button id="sellHouse">
                        <img src="images/sell_icon.png" alt="Sell House"><br>
                        Sell House<br>($800)
                    </button>
                    <button id="buyTractor">
                        <img src="images/tractor_icon.png" alt="Buy Tractor"><br>
                        Buy Tractor<br>($4000)
                    </button>
                    <button id="sellTractor">
                        <img src="images/sell_icon.png" alt="Sell Tractor"><br>
                        Sell Tractor<br>($3200)
                    </button>
                    <input type="number" id="loanAmount" placeholder="Enter loan amount">
                    <button id="takeLoan">
                        <img src="images/loan_icon.png" alt="Take Loan"><br>
                        Take Loan
                    </button>
                    <button id="repayLoan">
                        <img src="images/repay_icon.png" alt="Repay Loan"><br>
                        Repay Loan
                    </button>
                    <button id="resetGame">
                        <img src="images/reset_icon.png" alt="Reset Game"><br>
                        Reset Game
                    </button>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 Drawing Engine Development Studios. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
